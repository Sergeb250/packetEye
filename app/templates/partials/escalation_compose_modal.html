<div class="modal fade" id="escalationComposeModal" tabindex="-1" aria-labelledby="escalationComposeTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content escalation-compose">
            <div class="modal-header py-2 border-bottom">
                <h5 class="modal-title" id="escalationComposeTitle">
                    <i class="bi bi-envelope-exclamation text-danger"></i> Escalate alert
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="escalation-compose-toolbar border-bottom px-3 py-2 d-flex flex-wrap gap-2 align-items-center bg-light">
                    <button type="button" class="btn btn-outline-primary btn-sm" id="escalationDraftBtn">
                        <i class="bi bi-robot"></i> Draft with AI
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="escalationDraftDetailedBtn">
                        <i class="bi bi-file-text"></i> Detailed draft
                    </button>
                    <span class="small text-muted ms-auto" id="escalationDraftStatus"></span>
                </div>
                <form id="escalationComposeForm" class="p-3">
                    <div class="mb-2 d-flex align-items-center border-bottom pb-2">
                        <label class="text-muted small me-2 mb-0" style="min-width:3rem">To</label>
                        <input type="email" class="form-control form-control-sm border-0 shadow-none" id="escalationTo"
                               placeholder="team@company.com" required>
                    </div>
                    <div class="mb-2 d-flex align-items-center border-bottom pb-2">
                        <label class="text-muted small me-2 mb-0" style="min-width:3rem">Cc</label>
                        <input type="email" class="form-control form-control-sm border-0 shadow-none" id="escalationCc"
                               placeholder="optional">
                    </div>
                    <div class="mb-2 d-flex align-items-center border-bottom pb-2">
                        <label class="text-muted small me-2 mb-0" style="min-width:3rem">Subject</label>
                        <input type="text" class="form-control form-control-sm border-0 shadow-none" id="escalationSubject"
                               placeholder="Alert escalation — suspicious traffic" required>
                    </div>
                    <textarea class="form-control border-0 shadow-none escalation-body" id="escalationBody" rows="12"
                              placeholder="Describe the alert, IOCs, and recommended actions…" required></textarea>
                </form>
            </div>
            <div class="modal-footer py-2 border-top">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Discard</button>
                <button type="button" class="btn btn-danger btn-sm" id="escalationSendBtn">
                    <i class="bi bi-send"></i> Send
                </button>
            </div>
        </div>
    </div>
</div>
