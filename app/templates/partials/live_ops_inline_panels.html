<div id="liveInvestigatePanel" class="card mt-3 d-none">

        <span><i class="bi bi-search text-info"></i> Investigation</span>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="liveInvestigatePanelHide">Hide</button>
    </div>
    <div class="card-body" id="investigateBody">
        <div class="empty-state text-muted small"><i class="bi bi-search"></i> Select Investigate on an alert.</div>
    </div>
</div>

<div id="liveOsintPanel" class="card mt-3 d-none">

        <button type="button" class="btn btn-outline-secondary btn-sm" id="liveOsintPanelHide">Hide</button>

</div>

<div id="liveThreatMapPanel" class="card mt-3 d-none">

        <button type="button" class="btn btn-outline-secondary btn-sm" id="liveThreatMapPanelHide">Hide</button>
