<div class="table-responsive">
    <table class="table table-dark table-sm table-hover">
        <thead>
            <tr>
                <th>Src IP</th><th>Dst IP</th><th>Port</th><th>Proto</th>
                <th>Bytes</th><th>Duration</th><th>App</th><th>Score</th>
            </tr>
        </thead>
        <tbody>
            {% for f in flows %}
            <tr>
                <td>{{ f.src_ip }}</td>
                <td>{{ f.dst_ip }}</td>
                <td>{{ f.dst_port }}</td>
                <td>{{ f.protocol }}</td>
                <td>{{ f.bytes_sent + f.bytes_recv }}</td>
                <td>{{ f.duration_ms }}ms</td>
                <td>{{ f.application_layer or '—' }}</td>
                <td>{{ '%.1f'|format(f.severity_score or f.anomaly_score or 0) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
