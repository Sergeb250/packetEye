<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login — packetEye</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center" style="min-height:100vh">
<div class="container col-md-4">
    <h3 class="mb-4">packetEye Login</h3>
    <form method="post">
        <div class="mb-3"><input type="text" name="username" class="form-control bg-dark text-light" placeholder="Username" required></div>
        <div class="mb-3"><input type="password" name="password" class="form-control bg-dark text-light" placeholder="Password" required></div>
        <button class="btn btn-info w-100">Login</button>
    </form>
</div>
</body>
</html>
